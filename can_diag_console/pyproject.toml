[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "can-diag-console"
version = "0.1.0"
description = "Interactive CAN diagnostic console for KWP2000 and UDS"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "diag-defs>=0.1.0",
  "diag-filter>=0.1.0",
  "python-can>=4.4.0",
  "can-isotp>=2.0.5",
  "scapy>=2.5.0",
  "pyusb>=1.3.1",
  "gs-usb>=0.3.1",
  "libusb-package>=1.0.26.3",
  "hexrec>=0.5.1",
  "prompt_toolkit>=3.0",
]

[project.scripts]
can-diag-console = "can_diag_console.__main__:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
